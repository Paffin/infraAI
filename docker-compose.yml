# Local / single-host deployment: the application and PostgreSQL.
#
#   make up            (writes .env with generated secrets, builds the image and starts it; `make try` starts the published image instead)
#   sh deploy/init-env.sh && docker compose up -d --build        - the same without make
#
# .env must hold APP_SECRET and POSTGRES_PASSWORD (compose refuses to start without them, the server refuses the placeholder of an old .env.example):
# do not copy .env.example by hand, `make .env` / deploy/init-env.sh fills them in.
#
# High availability on one host (for trials; production belongs on Kubernetes, see deploy/k8s):
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --build
services:
  db:
    image: ${REGISTRY:-docker.io/library}/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: infra
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (make .env writes one)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infra"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    image: infra-architect:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://infra:${POSTGRES_PASSWORD}@db:5432/infra
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (make .env writes one)}
      APP_ENV: ${APP_ENV:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_PROJECT: ${SEED_DEMO_PROJECT:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s

volumes:
  pgdata:
