name: Ошибка / Bug
description: Что-то работает не так, как описано
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашли время. **Об уязвимости не пишите сюда** — см. [SECURITY.md](https://github.com/Paffin/infraAI/blob/main/SECURITY.md).
        Неверный факт о продукте каталога (отказоустойчивость, версия, вариант) — в форму «Исправление каталога».
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы увидели. Скриншот или текст ошибки — отлично.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Шаги от чистого состояния. Если дело в схеме — приложите её (в редакторе: **Экспорт → JSON**).
      placeholder: |
        1. Открыть эталонную архитектуру «2 ЦОД + witness»
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: «Помощь → О программе»
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: Как запущено
      options: [Docker Compose, Kubernetes, cargo run (разработка), CLI infra-architect check, Другое]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Браузер и система
      placeholder: Firefox 130, Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Логи сервера или консоль браузера
      render: text
