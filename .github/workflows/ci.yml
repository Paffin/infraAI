name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The default catalog is what its sources build (deploy/catalog)
        run: python3 deploy/catalog/build.py --check
      - name: The reference architectures written in code are what their sources build (deploy/templates)
        run: python3 deploy/templates/build.py --check
      - name: Generated documentation is up to date
        run: python3 deploy/gen-docs.py --check
      - name: Everything shipped carries a license the project accepts, and the list of them is current
        run: python3 deploy/licenses.py --check
      - name: The quick start holds together (generated .env, the example is refused as it is, the published-image override keeps the hardening)
        run: sh deploy/check-env.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /k8s > /tmp/all.yaml
          docker run --rm -v /tmp/all.yaml:/all.yaml:ro ghcr.io/yannh/kubeconform:latest -strict -summary -ignore-missing-schemas /all.yaml

  # Optional: the real OpenRouter. Runs on demand (Actions → CI → Run workflow) when the secret OPENROUTER_API_KEY is set.
  live-llm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test -p server --test live -- --ignored --nocapture
        working-directory: backend

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Generate IaC for the reference architectures
        working-directory: backend
        run: |
          mkdir -p /tmp/iac-out
          cargo build -q -p engine --example export
          for tpl in demo $(cd crates/engine/defaults/templates && ls *.json | sed 's/\.json$//'); do
            for fmt in kubernetes helm terraform; do
              ./target/debug/examples/export "$tpl" "$fmt" "/tmp/iac-out/$tpl/$fmt" en > /dev/null 2> "/tmp/iac-out/$tpl-$fmt.report.json"
            done
          done
      - name: Validate against Kubernetes and CRD schemas, Helm charts and Terraform providers
        run: |
          docker build -t infra-architect-iac-check deploy/iac-check
          docker volume create iac-cache
          docker run --rm -v /tmp/iac-out:/out:ro -v "$PWD/backend/crates/engine/defaults:/defaults:ro" -v iac-cache:/cache infra-architect-iac-check

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs, iac]
    # compose refuses to read docker-compose.yml without these (it requires them), so every step that calls it needs them:
    # the last one, `down`, used to run without and failed, and a failed image job meant that nothing was ever published
    env:
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      POSTGRES_PASSWORD: ci-postgres
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci admin password 123
      APP_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: infra-architect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Smoke test the stack (`make try`: the image just built, started the way a user starts the published one)"
        env:
          IA_IMAGE: infra-architect:ci
          TRY_PULL: never
        run: |
          make try
          ./deploy/smoke.sh http://localhost:8080 "$ADMIN_EMAIL" "$ADMIN_PASSWORD"
      - name: "The gate in the image: every reference design passes, and the SARIF it writes is valid"
        run: |
          mkdir -p /tmp/gate
          for f in backend/crates/engine/defaults/templates/*.json; do
            docker run --rm -v "$PWD:/work:ro" -w /work infra-architect:ci check "$f" --lang en --format sarif > "/tmp/gate/$(basename "$f" .json).sarif"
          done
          python3 -m pip install --quiet jsonschema
          python3 deploy/check-sarif.py /tmp/gate/*.sarif
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser end-to-end tests against the running stack
        working-directory: frontend
        env:
          E2E_BASE: http://localhost:8080
          E2E_EMAIL: ${{ env.ADMIN_EMAIL }}
          E2E_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Take the stack down
        if: always()
        run: docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: [image, manifests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/infra-architect
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
