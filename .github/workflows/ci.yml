name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The default catalog is what its sources build (deploy/catalog)
        run: python3 deploy/catalog/build.py --check
      - name: The reference architectures written in code are what their sources build (deploy/templates)
        run: python3 deploy/templates/build.py --check
      - name: Generated documentation is up to date
        run: python3 deploy/gen-docs.py --check
      - name: Everything shipped carries a license the project accepts, and the list of them is current
        run: python3 deploy/licenses.py --check
      - name: The quick start holds together (generated .env, the example is refused as it is, the published-image override keeps the hardening)
        run: sh deploy/check-env.sh
      - name: The scripts under deploy/ that decide something are tested (they have a failing case of their own)
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 -m unittest discover -s deploy/tests -v

  # cargo-deny on the locked crates, npm audit on the web application's packages, and the proof that cargo-deny is awake (.github/workflows/security.yml, which
  # also runs every day). It is a job here and not a workflow of its own because `publish` can only wait for a job of this file. The permission is the one
  # job `report` of that file asks for (it opens an issue when the daily run is red and never runs from here); a called workflow may not hold more than its caller grants.
  security:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/security.yml

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro" registry.k8s.io/kustomize/kustomize:v5.4.3 build /k8s > /tmp/all.yaml
          docker run --rm -v /tmp/all.yaml:/all.yaml:ro ghcr.io/yannh/kubeconform:latest -strict -summary -ignore-missing-schemas /all.yaml
      - name: "The metrics port is on no Service and no Ingress path, and has a caller of its own in the NetworkPolicy (kubeconform checks the schema, not that)"
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 deploy/check-k8s-exposure.py /tmp/all.yaml

  # Optional: the real OpenRouter. Runs on demand (Actions → CI → Run workflow) when the secret OPENROUTER_API_KEY is set.
  live-llm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test -p server --test live -- --ignored --nocapture
        working-directory: backend

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Generate IaC for the reference architectures
        working-directory: backend
        run: |
          mkdir -p /tmp/iac-out
          cargo build -q -p engine --example export
          for tpl in demo $(cd crates/engine/defaults/templates && ls *.json | sed 's/\.json$//'); do
            for fmt in kubernetes helm terraform; do
              ./target/debug/examples/export "$tpl" "$fmt" "/tmp/iac-out/$tpl/$fmt" en > /dev/null 2> "/tmp/iac-out/$tpl-$fmt.report.json"
            done
          done
      - name: Validate against Kubernetes and CRD schemas, Helm charts and Terraform providers
        run: |
          docker build -t infra-architect-iac-check deploy/iac-check
          docker volume create iac-cache
          docker run --rm -v /tmp/iac-out:/out:ro -v "$PWD/backend/crates/engine/defaults:/defaults:ro" -v iac-cache:/cache infra-architect-iac-check

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs, iac]
    # compose refuses to read docker-compose.yml without these (it requires them), so every step that calls it needs them:
    # the last one, `down`, used to run without and failed, and a failed image job meant that nothing was ever published
    env:
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      POSTGRES_PASSWORD: ci-postgres
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci admin password 123
      APP_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: infra-architect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Trivy sees the operating-system packages of the image (Debian bookworm-slim), nothing else: the binary is stripped and carries no list of its crates,
      # and the image has no lock file. The crates are cargo-deny's (security.yml). A fixable CRITICAL package blocks main and so the publishing; on a pull
      # request, and for HIGH everywhere, it is only shown, because a CVE that Debian fixed this morning is not the pull request's doing (docs/PITFALLS.md,
      # the row about Dependabot's pull requests). .trivyignore: every entry has an `exp:` date, after which Trivy ignores the ignore.
      - name: "Operating-system packages of the image: what is HIGH or CRITICAL and fixed upstream (shown)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: infra-architect:ci
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
          hide-progress: true
      - name: "Operating-system packages of the image: no CRITICAL one that is fixed upstream (blocks main, not a pull request)"
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: infra-architect:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          hide-progress: true
      - name: "Smoke test the stack (`make try`: the image just built, started the way a user starts the published one)"
        env:
          IA_IMAGE: infra-architect:ci
          TRY_PULL: never
        run: |
          # TRY_PULL=never keeps the image that was just built (it exists nowhere else); the database image is the only one that has to come from the registry
          docker compose pull db
          make try
          ./deploy/smoke.sh http://localhost:8080 "$ADMIN_EMAIL" "$ADMIN_PASSWORD"
      - name: "Smoke test with the metrics on a port of their own (METRICS_PORT: the application's port answers 404 on /metrics, the scrape is on :9090)"
        env:
          IA_IMAGE: infra-architect:ci
        run: |
          # the same stack with the override that sets METRICS_PORT and publishes it on the loopback; compose recreates the application container
          docker compose -f docker-compose.yml -f deploy/compose.try.yml -f docker-compose.metrics.yml up -d --pull never --wait --wait-timeout 180
          SMOKE_METRICS_URL=http://127.0.0.1:9090 ./deploy/smoke.sh http://localhost:8080 "$ADMIN_EMAIL" "$ADMIN_PASSWORD"
      - name: "The gate in the image: every reference design passes, and the SARIF it writes is valid"
        run: |
          mkdir -p /tmp/gate
          for f in backend/crates/engine/defaults/templates/*.json; do
            docker run --rm -v "$PWD:/work:ro" -w /work infra-architect:ci check "$f" --lang en --format sarif > "/tmp/gate/$(basename "$f" .json).sarif"
          done
          python3 -m pip install --quiet jsonschema
          python3 deploy/check-sarif.py /tmp/gate/*.sarif
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser end-to-end tests against the running stack
        working-directory: frontend
        env:
          E2E_BASE: http://localhost:8080
          E2E_EMAIL: ${{ env.ADMIN_EMAIL }}
          E2E_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Take the stack down
        if: always()
        run: docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: [image, manifests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/infra-architect
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
