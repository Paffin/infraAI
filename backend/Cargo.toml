[workspace]
resolver = "2"
members = ["crates/engine", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
minijinja = { version = "=3.0.0", default-features = false, features = ["builtins", "serde", "fuel", "json", "preserve_order", "std_collections"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
