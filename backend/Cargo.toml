[workspace]
resolver = "2"
members = ["crates/engine", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Paffin/infraAI"
homepage = "https://github.com/Paffin/infraAI"
authors = ["The Infra Architect Authors"]
rust-version = "1.89"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
minijinja = { version = "=3.0.0", default-features = false, features = ["builtins", "serde", "fuel", "json", "preserve_order", "std_collections"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Argon2 is the cost of a sign-in. Unoptimised it is half a second per password (the debug build of the tests signs in dozens of times); optimised it is
# what the release build pays. Only these two crates: everything else keeps the fast debug build.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
