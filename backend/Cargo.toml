[workspace]
resolver = "2"
members = ["crates/engine", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Paffin/infraAI"
homepage = "https://github.com/Paffin/infraAI"
authors = ["The Infra Architect Authors"]
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
minijinja = { version = "=3.0.0", default-features = false, features = ["builtins", "serde", "fuel", "json", "preserve_order", "std_collections"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
