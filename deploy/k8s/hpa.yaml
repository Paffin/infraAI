apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infra-architect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infra-architect
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
