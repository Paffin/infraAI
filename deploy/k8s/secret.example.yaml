# EXAMPLE ONLY – do not commit real values. Create the secret out of band (sealed-secrets, external-secrets,
# `kubectl create secret generic …`) and keep this file out of kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: infra-architect
type: Opaque
stringData:
  # postgres://user:password@host:5432/db?sslmode=require – a managed or HA PostgreSQL (see postgres-cnpg.example.yaml)
  DATABASE_URL: postgres://infra:CHANGE_ME@infra-pg-rw:5432/infra?sslmode=require
  # >= 32 characters, identical for every replica; losing it makes stored secrets unreadable
  APP_SECRET: CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME
  # optional: initial administrator password (otherwise generated and printed once in the log)
  ADMIN_PASSWORD: ""
  # optional: OpenRouter key (can be set in the admin panel instead)
  OPENROUTER_API_KEY: ""
  METRICS_TOKEN: ""
