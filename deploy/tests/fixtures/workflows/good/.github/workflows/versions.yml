name: Release tables
on:
  workflow_dispatch:

concurrency:
  group: versions-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test -p engine --locked
      - run: npm ci
      - run: python3 deploy/release-patch.py make "$RUNNER_TEMP/p.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

  commit:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: python3 deploy/release-patch.py apply "$RUNNER_TEMP/p.patch"
      - run: |
          git config user.name "github-actions[bot]"
          git commit -m "Release tables"
          git push
